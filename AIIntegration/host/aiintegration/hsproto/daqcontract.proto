syntax  = "proto3";
package daq;
option  go_package="protocolgate/proto/contract;contract";
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

// ============================================================================
// daqcontract.proto —— daqgate 与 historystore / ProtocolWeb 共享的「基础公共数据契约」
//
// 单一可信源在 daqgate/ProtocolGate/proto，由 daqgate 负责管理；编译后由 build.sh
// 拷贝至 historystore/proto 与 ProtocolWeb/src/protos 重新编译。**严禁在拷贝端改本文件**。
//
// 约定：字段号一经分配永不复用/变更（wire 兼容是微服务总线的根，见 daqgate/docs/）。
// 内含：Status(状态) / VARVAL·VQT(值与质量时戳) / VTI·BCR·SCD(VQT 超集用到的 IEC61850 值)
//       / EntityConfig(实体元数据，总线 KV 注册契约)。
// 详见 daqgate/docs/proto-contract.md。
// ============================================================================

// ---- 状态码与状态 (StatusCode / Status) ----
