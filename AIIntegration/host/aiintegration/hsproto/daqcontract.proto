	Ok							= 1;
	Linking						= 2;
	Doned						= 3;
	Loading						= 5;
	NormalCancelled				= 6;
	LogIn						= 7;
	LogOut						= 8;
	Running						= 9;
	Starting					= 10;
	Started						= 11;
	
	Info						= 12;
	IdleRun						= 13;
	Changed						= 14;
	Loaded						= 15;
	WaitLink					= 16;
	Linked						= 17;
	StreamBegin					= 18;
	Init						= 19;
	StreamData					= 20;
	Created						= 21;
	GotoBreak					= 22;
	
	QualityGood 				= 5000;
	QualityInitial				= 5001;
	QualityNo					= 5002;
	QualityLocalOverride		= 5003;
	QualityPending				= 5004;
	QualitySubstituted			= 5005;

	Uncertain					= 6000;

	Warn						= 8000;
