// aiintegration.proto —— AIIntegration(Python 服务) ⇄ AICloud(Go 后端) 的控制面契约
//
// ★**正本在本仓**（`daqvision/AIIntegration/proto/`）。分发点 `AISERVER:/home/Project/AIIntegration/proto/`
//   是副本；两边不一致时以本仓为准，且说明我方漏投了 —— **改即投并发函**（AI-9 §2.3、C-9 §2.1）。
//
// ★形态（C-8 §3 定）：**控制面走 gRPC，大对象走 HTTP**。
//   结构化、要契约、要版本、要类型的走这里；模型工件/图片/数据集导出走 HTTP，本文件不管。
//
// ★**浏览器不直连我方**（AI-9 §2.2）。本口只面向 AICloud 后端，由它桥给前端并**逐个 RPC 自查 ACL**。
//   我方不实现平台的账号体系 —— 抄一份必漂，漂的样子是"这个人在平台里看不到这台设备，
//   却能在 AI 页面上改它的标注"。
//
// 改动规则：字段编号只增不改不复用；废弃用 reserved；改契约必须升 proto_version 并记 CHANGELOG。
syntax = "proto3";
package aiintegration;

import "google/protobuf/timestamp.proto";

service AIIntegrationService {
  // 服务身份与能力。启动握手 + 周期探活。
  rpc GetInfo (InfoRequest) returns (InfoReply);

  // ★域发现：有哪些域、各自**有哪些能力位**。
  //   前端**按能力位渲染**，不按域名分支 —— 新增一个 AI 域，前端零改动（AI-8 §2，贵方 C-7 §2 已确认吃得下）。
  rpc ListDomains (DomainsRequest) returns (DomainsReply);

  // ── 绑定：把域声明的输入角色对到实际测点 ──
  rpc ListBindings (ListBindingsRequest) returns (ListBindingsReply);
  rpc PutBinding   (PutBindingRequest)   returns (PutBindingReply);
  rpc DeleteBinding(DeleteBindingRequest) returns (DeleteBindingReply);

  // ── 日志：**形状与 historystore 逐条对齐**（用户要求"装设 hs 类似的日志接口"）──
  //   对齐的四条见 host/aiintegration/logstore.py 模块头：同一判据、ASCII 折叠、真实总数、背压不静默。
  rpc SubscribeLogs (LogSubscribeReq) returns (stream LogStreamItem);
  rpc QueryLogs     (LogQueryReq)     returns (QueryLogsRes);

  // ═══════════ 工作台（1.2 新增，对应贵方 C-11 §2 表里 4~7 那四类页面）═══════════
  //
  // ★三条贯穿本段的语义，都是贵方 C-11 点名要保住的，我方在**库层**落死（不靠调用方自觉）：
  //   ① **标注 ≠ 样本**：标注是"人对一段数据的判断"，样本是"进了某个训练集的那份拷贝"；
  //   ② **移出 ≠ 删除**：`RemoveSamples` 只解训练集与样本的关系，**原始标注一动不动**；
  //   ③ **标签不枚举**：没有标签表，`ListLabels` 从现有数据聚合，新标签用一次就存在。
  //
  // ★外加一条我方自己的：**样本上的标签是入集那一刻的快照**，不跟随标注改动 ——
  //   否则"这个模型当初是用什么训的"就没有答案了。

  // ── 标注工作台 ──
  rpc ListAnnotations   (ListAnnotationsReq)   returns (ListAnnotationsRes);
  rpc PutAnnotation     (PutAnnotationReq)     returns (MutateRes);
  rpc AnnotateRange     (AnnotateRangeReq)     returns (AnnotateRangeRes);
  rpc DeleteAnnotations (DeleteAnnotationsReq) returns (MutateRes);
  rpc ListLabels        (ListLabelsReq)        returns (ListLabelsRes);

  // ── 训练集 / 知识库 ──
  rpc ListDatasets  (ListDatasetsReq) returns (ListDatasetsRes);
  rpc PutDataset    (PutDatasetReq)   returns (MutateRes);
  rpc DeleteDataset (IdReq)           returns (MutateRes);
  rpc CopyDataset   (CopyDatasetReq)  returns (MutateRes);   // 整库复制，连样本一起

  // ── 样本 ──
  rpc ListSamples   (ListSamplesReq)   returns (ListSamplesRes);
  rpc AddSamples    (AddSamplesReq)    returns (MutateRes);   // 把标注拷进训练集（幂等）
  rpc RemoveSamples (RemoveSamplesReq) returns (MutateRes);   // ★只解关系，不动标注
  rpc CopySamples   (CopySamplesReq)   returns (MutateRes);

  // ── 模型工件（含基线：同一张表，`kind` 区分）──
  rpc ListArtifacts    (ListArtifactsReq) returns (ListArtifactsRes);
  rpc ActivateArtifact (IdReq)            returns (MutateRes);
  // 停用（1.7 新增）。★**启用只让同作用域的旧件让位**，所以作用域本身建错的那个件
  //   （训练时 `binding` 传空落成"全域通用"）此前**永远取消不掉** —— 同作用域里没有
  //   别的件能顶掉它，而 `DeleteArtifact` 又拒删激活中的。我方 2026-09-16 现场撞上了。
  // ★停用后该对象**没有可用工件**，结论会落 `MODEL_NOT_LOADED(-1034)` —— 这是对的：
  //   没有基线就该说没有基线。界面上请按"会让该对象停止出第②层结论"来提示。
  // `ok=true, id=<1 本来是激活的 / 0 本来就没激活>`；没这个工件则 `ok=false`。
  rpc DeactivateArtifact (IdReq)          returns (MutateRes);
  rpc DeleteArtifact   (IdReq)            returns (MutateRes);   // ★激活中的不让删

  // ── 训练任务（★可查询状态的任务，不是阻塞调用；C-11 §3.3）──
  rpc ListTrainJobs (ListTrainJobsReq) returns (ListTrainJobsRes);
  rpc GetTrainJob   (IdReq)            returns (TrainJob);
  // 1.3 开：建一条待跑任务**立刻返回**，后台串行跑。★不是阻塞调用 —— 界面随便关。
  rpc StartTraining (StartTrainingReq) returns (MutateRes);
  // 取消。★回执会**如实说**实际发生了什么：排队中的当场取消；正在跑的只是"请求取消"，
  //   算法不检查取消标志就会跑完当前这次训练才停 —— 我方不谎报"已取消"。
  rpc CancelTrainJob(IdReq)            returns (MutateRes);

  // ── 片段归档与报告 ──
  rpc ListSegments  (ListSegmentsReq) returns (ListSegmentsRes);
  rpc PutSegment    (PutSegmentReq)   returns (MutateRes);
  rpc DeleteSegment (IdReq)           returns (MutateRes);
  rpc ListReports   (IdReq)           returns (ListReportsRes);   // id = 片段 id
  // 对某个片段**再判别一次**（C-11 §3.4）：取那段数据重跑一遍推理。
  // ★**不写回实时库** —— 回溯判别是"看看当时若用现在的模型会怎样"，写回去就篡改了历史。
  rpc RediagnoseSegment (IdReq) returns (RediagnoseRes);
}

// ───────────────────────── 身份与能力 ─────────────────────────
message InfoRequest {}
message InfoReply {
  string service_version = 1;
  string proto_version   = 2;   // 本契约版本，如 "1.0"
  string guid            = 3;   // 本服务的系统 guid（首启生成、永不变）
  string runtime         = 4;   // 如 "CPython 3.11.2 / linux-x86_64"
  int32  domain_count    = 5;
  // 装载失败的域（文件名 + 原因）。★**不藏**：静默跳过会变成"某个域莫名其妙不见了"。
  repeated DomainLoadError load_errors = 6;
}
message DomainLoadError {
  string file   = 1;
  string reason = 2;
}

// ───────────────────────── 域与能力位 ─────────────────────────
message DomainsRequest {}
message DomainsReply { repeated DomainInfo domains = 1; }

message DomainInfo {
  string key     = 1;   // 运行期值，**不是编译期枚举**
  string display = 2;
  string version = 3;
  // ★能力位。**名字是契约**：加位随时，改义发函（贵方 C-7 §2 提，我方采纳）。
  //   已知位：infer / train / annotate / artifact。
  repeated string capabilities = 4;
  repeated InputSpec  inputs   = 5;
  repeated OutputSpec outputs  = 6;
  // ★台账参数自述（1.1 新增）。贵方**按这张表渲染绑定表单**，不要按域名写死字段 ——
  //   与能力位同一条道理：新增域不改前端。取值都放在 `Binding.params` 里（字符串）。
  repeated ParamSpec  params   = 7;
}
// 一项台账参数的自述。**域定义它，骨架只搬运**。
message ParamSpec {
  string key         = 1;   // 如 iso_group
  string display     = 2;   // 如 "ISO 10816-3 机组类别"
  string value_type  = 3;   // float | int | bool | string | enum
  // value_type=enum 时的候选值；其余类型为空。★候选值是**取值本身**，
  // 显示名走 choice_displays（同序），空则直接显示取值。
  repeated string choices          = 4;
  repeated string choice_displays  = 5;
  string default     = 6;   // 空 = 无缺省（必须由人填）
  bool   required    = 7;   // ★缺了它，本域的部分结论会落坏质量码而不是猜一个
  string unit        = 8;
  string description = 9;
  // ★参数归属（1.8 新增，贵方 C-40 §3.2 请求、我方 AI-41 §2.1 已接受）：
  //   `machine`  = 设备固有属性（机组类别、支承方式、额定转速……），在设备上填一次，
  //                同一台设备的各条诊断共用；
  //   `position` = 随这条诊断填（轴向是哪一轴、速度口径……，跟着传感器安装与型号走）。
  //   空 = 域未声明。★我方**不替空值猜归属**；贵方可按 `position` 渲染。
  //   ⇒ 贵方界面按层级分处填写，下发 `Binding.params` 时**合并成一份**；我方只收合并后的结果。
  string level       = 10;
}
message InputSpec {
  string role        = 1;   // 域内角色名，绑定时对到实际测点
  string unit        = 2;   // ★仅作核对提示，**我方不做单位换算**（换错了比不换更危险）
  bool   required    = 3;
  string description = 4;
  // ★输入的**形态**（1.4 新增）：`point` = 测点，绑定时对到 globalId，我方按节拍去取；
  //   `image` = 图片，**不绑测点**，由现场上传触发（见下方「事件驱动入口」）。
  //   老版本不发这个字段 ⇒ 空串，请按 `point` 理解。**不是封闭枚举**：将来会有别的形态，请按字符串透传。
  //
  //   ⇒ 贵方绑定表单：`point` 类角色画"选测点"，`image` 类角色**不画**；
  //     一个域若全是 `image` 类输入，它的 `Binding.roles` 就是空的 —— 这种域我方放行空 roles，
  //     绑定照样要建（台账参数与结论点都挂在绑定上）。
  string kind        = 5;
  // ★给人看的名字（1.8 新增），如 "X 轴速度"。贵方选采集点表单**显示它**，不显示 `role`。
  //   空 = 域未提供，请回退显示 `role`。
  string display     = 6;
}

// ───────────────────────── 外部工件导入（1.5，走 HTTP，不在本 service 里）─────────────────────────
//
// 模型是大对象，按 C-8 §3 走 HTTP 口：
//
//   POST /artifacts/import/{domain}?name=…&source=…&training_data=…&license=…[&kind=model][&binding=…][&ext=.onnx][&algo=…][&note=…]
//     正文：工件原始字节
//     ★查询参数要**百分号编码**（UTF-8），中文照常可用。
//     ★`name` / `source` / `training_data` / `license` **必填** —— 不清楚就明写"未知"，**留空一律 400**。
//     只对声明了 `artifact` 能力位的域成立；域会先校验文件（比如 ONNX 能否加载、类别表对不对），不过回 422。
//     同一文件（sha256 相同）重复导入回 409，并指明已有的工件号。
//
//   200 → {"ok", "artifact_id", "path", "size", "sha256", "validated", "facts": {…}, "warnings": [...]}
//     ★`validated=false` = 该域没提供校验，文件没经过"能不能用"的检查 —— 请显示出来。
//     ★`facts` 是域从文件里读出的事实（模型元数据里的描述、版本、许可、类别表…），已原样存进工件。
//     ★**导入不自动启用**：仍需 `ActivateArtifact`。
//   404 域未装载；409 域不接受外部工件 / 同一文件已导入；400 缺必填项或参数不对；413 太大；422 域校验不过。

// ───────────────────────── 事件驱动入口（1.4，走 HTTP，不在本 service 里）─────────────────────────
//
// 图片是大对象，按 C-8 §3 走 HTTP 口（缺省 127.0.0.1:50071）：
//
//   POST /infer/{domain}/{binding}
//     正文：图片原始字节（不是 multipart）
//     Content-Type  : image/jpeg | image/png | …（必填）
//     Content-Length: 必填，上限 20 MB（超了 413）
//     X-Captured-At : ★**拍照时刻**，ISO 8601，**必须带时区**（`Z` 或 `+08:00`）。缺了 / 不带时区 ⇒ 400。
//                     结论的时刻就是它，不是上传时刻 —— 巡检拍完半小时后才上传，不能记成"现在"。
//     X-Role        : 域有多路图片输入时指明是哪一路（只有一路可不给）
//     X-Source      : 来源说明（可选，只搬运）
//
//   200 → {"ok", "error", "domain", "binding", "captured_at", "written", "write_note",
//          "findings": [{"key", "value", "quality", "status_code", "t"}]}
//     ★`written=false` 时 `write_note` 说明为什么没写进实时库（比如只读运行）—— 请显示出来。
//     ★质量非 Ok 时 `value` 恒为 null。
//   404 域未装载 / 没有这个绑定；409 该域没有图片类输入 / 绑定已停用；
//   400 参数不对（缺时刻、空正文…）；413 太大；503 推理繁忙（请稍后重试，**我方不无限排队**）。
message OutputSpec {
  string key         = 1;
  string display     = 2;
  string value_type  = 3;   // float | int | bool | string
  string unit        = 4;
  string description = 5;
}

// ───────────────────────── 绑定 ─────────────────────────
message Binding {
  string domain  = 1;
  string binding = 2;              // 被诊断对象标识；我方不解释它
  // 角色 → **globalId**。★取数走明文回环全量连接，那条连接上一律 globalId；
  //   写结论走受限连接用 localId —— 两者不是同一个号，**不要互相换算着用**。
  map<string, int32> roles = 3;
  double interval_sec = 4;
  double window_sec   = 5;
  bool   enabled      = 6;
  // 声明里必填、而本绑定没给的角色。**只读**，我方算好回给贵方渲染"配置不全"提示。
  repeated string missing_required = 7;
  // ★被诊断对象的**台账参数**（1.1 新增）：额定功率等级、刚性/柔性支承、轴向是哪一轴、
  //   速度口径是不是 RMS…… 这些是"每台机器一份"的静态事实，**不是测点**，
  //   绑不到 globalId 上，但判据离了它们就出不来（ISO 10816 分级要的正是这几项）。
  //
  //   ★**骨架只搬运不解释**（照 hs 的 `GatewayIdentity.attrs` 那条规矩）：
  //     键名与取值由**域**定义并在 `DomainInfo.param_specs` 里自述，骨架不枚举、不校验语义。
  //     ⇒ 新增一个域带来新的参数，骨架与贵方前端都不改 —— 前端按 `param_specs` 渲染表单。
  map<string, string> params = 8;
  // ★**这组点接的是仿真信号还是现场工况**（1.6 新增，贵方 C-36 §4 请求）。
  //   `simulated` / `field` / 空。**不是封闭枚举**，请按字符串透传，别写死分支。
  //
  //   ★为什么记在绑定上，而不是记在每条标注上：**仿真与否是点的性质**——
  //     绑的那组点接的就是仿真信号源，与人框了哪一段无关。声明一次，
  //     标注/样本/工件自动继承，**人没有机会漏填某一段**。
  //   ★样本**入集那一刻打快照**：日后真机接入、本格改成 `field`，
  //     **不会反写**当初用仿真数据训出来的工件（照 `Sample.label` 那条既有规矩）。
  //   ★**空 ≠ 现场**：请显示「未声明」，且与 `field` 用不同样式（贵方 C-36 §4.2.1）。
  string data_origin = 9;
}
message ListBindingsRequest { string domain = 1; }   // 空 = 全部
message ListBindingsReply   { repeated Binding bindings = 1; }
message PutBindingRequest   { Binding binding = 1; }
message PutBindingReply     { bool ok = 1; string message = 2; }
message DeleteBindingRequest{ string domain = 1; string binding = 2; }
// ★删绑定**只停算，不删已经写进实时库的结论点** —— 绑定是"要不要继续算"，
//   结论点是"算过的历史"，顺手删点会把用户唯一能回看的东西抹掉。
message DeleteBindingReply  { bool ok = 1; string message = 2; }

// ───────────────────────── 日志（形状对齐 hs）─────────────────────────
enum LogLevel {
  Trace_LogLevel = 0;
  Debug_LogLevel = 1;
  Info_LogLevel  = 2;
  Warn_LogLevel  = 3;
  Error_LogLevel = 4;
  Fatal_LogLevel = 5;
  Off_LogLevel   = 6;
}
message LogRecord {
  int32                     SequenceId = 1;
  google.protobuf.Timestamp TimeStamp  = 2;
  LogLevel                  LogLevel   = 3;
  string                    Category   = 4;
  string                    Message    = 5;
  string                    MemberName = 6;
  int32                     LineNumber = 7;
  int32                     StatuCode  = 8;   // 拼写与 hs 契约一致（对方就是这么拼的）
}
message LogSubscribeReq {
  LogLevel minLevel = 1;
  string   category = 2;   // 空=不限；非空=**精确相等**（同 hs）
  // 空=不限。Message 子串，**大小写不敏感**，但折叠**只作用于 ASCII A-Z/a-z**，
  // 中文等非 ASCII 原样比较 —— 与 hs 1.9.199 起的判据逐字一致。
  // ★与 QueryLogs 的 search **同一判据**：实时流与历史翻阅是同一个列表里上下相邻的行，
  //   不许两套语义（hs 原话）。我方实现上两条路调同一个函数。
  string   search   = 3;
  int32    backlog  = 4;   // 先补发最近 N 条（0=不补）；补发段与实时段同一过滤
}
message LogStreamItem {
  oneof item {
    LogRecord record       = 1;
    uint64    droppedTotal = 2;   // ★背压**不静默**：丢了多少要说，少几行的日志比没有日志更误导
  }
}
message LogQueryReq {
  google.protobuf.Timestamp fromTime = 1;   // 含下界（不设=不限）
  google.protobuf.Timestamp toTime   = 2;   // 含上界（不设=不限）
  LogLevel minLevel   = 3;
  string   category   = 4;
  string   search     = 5;
  int32    offset     = 6;
  int32    limit      = 7;
  bool     newestFirst= 8;
}
message QueryLogsRes {
  int32              TotalCount    = 1;   // ★**过滤后的真实匹配总数**，不是本页条数
  repeated LogRecord Logs          = 2;
  // 本页已含**内存环里**最早的一条。★与 hs 的一处**诚实差异**：hs 那边指"当前文件中最早可用记录"，
  //   我方读内存环 —— 环挤掉过东西就**不报**到底（更早的只在磁盘文件里，本接口查不到）。
  bool               ReachedOldest = 3;
  int64              EvictedTotal  = 4;   // 被内存环挤掉的总条数；>0 说明历史翻阅已不完整
}


// ═════════════════════ 工作台（1.2 新增）═════════════════════

// 通用的"改了一下"回执。★`ok=false` 时 `message` 是**给人看的原因原文**，
// 我方原样回、不吞 —— 界面要能直接把它显示出来。
message MutateRes {
  bool   ok      = 1;
  int64  id      = 2;   // 新建时是新 id；批量操作时是受影响条数
  string message = 3;
}
message IdReq { int64 id = 1; }

// ── 标注 ──
message Annotation {
  int64  id      = 1;
  string domain  = 2;
  string binding = 3;   // 被诊断对象
  google.protobuf.Timestamp t_from = 4;
  google.protobuf.Timestamp t_to   = 5;
  string label   = 6;   // ★运行期值，**不是枚举**
  string note    = 7;
  string created_at = 8;
  string updated_at = 9;
}
message ListAnnotationsReq {
  string domain  = 1;
  string binding = 2;
  string label   = 3;
  // ★时间过滤是**区间相交**，不是"被完全包含"：框一小段也该找到跨过它的那条标注。
  google.protobuf.Timestamp t_from = 4;
  google.protobuf.Timestamp t_to   = 5;
  int32  offset  = 6;
  int32  limit   = 7;   // 上限 1000；超了**报错**，不静默截断
}
message ListAnnotationsRes {
  repeated Annotation items = 1;
  int32 total = 2;      // ★过滤后的真实总数，不是本页条数
}
message PutAnnotationReq {
  int64  id      = 1;   // 0 = 新建；非 0 = 改这条（改不存在的会报错，**不静默新建**）
  string domain  = 2;
  string binding = 3;
  google.protobuf.Timestamp t_from = 4;
  google.protobuf.Timestamp t_to   = 5;
  string label   = 6;
  string note    = 7;
}
// 按时间范围**批量**给多个对象打同一个标签。★一个事务：要么都进，要么一条都不进。
message AnnotateRangeReq {
  string domain = 1;
  repeated string bindings = 2;
  google.protobuf.Timestamp t_from = 3;
  google.protobuf.Timestamp t_to   = 4;
  string label = 5;
  string note  = 6;
}
message AnnotateRangeRes {
  bool   ok = 1;
  repeated int64 ids = 2;
  string message = 3;
}
message DeleteAnnotationsReq { repeated int64 ids = 1; }

// 现有标签 + 各自条数。**从数据聚合，没有标签表**。
message ListLabelsReq {
  string domain     = 1;
  int64  dataset_id = 2;   // 给了就按该训练集里的样本聚合；否则按域里的标注聚合
}
message LabelCount { string label = 1; int32 count = 2; }
message ListLabelsRes { repeated LabelCount items = 1; }

// ── 训练集与样本 ──
message Dataset {
  int64  id     = 1;
  string domain = 2;
  string name   = 3;
  string note   = 4;
  int32  sample_count = 5;
  string created_at   = 6;
  string updated_at   = 7;
}
message ListDatasetsReq { string domain = 1; }
message ListDatasetsRes { repeated Dataset items = 1; }
message PutDatasetReq {
  int64  id     = 1;   // 0 = 新建
  string domain = 2;
  string name   = 3;   // 域内唯一；重名会被拒并说清是哪个名字撞了
  string note   = 4;
}
message CopyDatasetReq { int64 id = 1; string new_name = 2; }

message Sample {
  int64  id            = 1;
  int64  dataset_id    = 2;
  int64  annotation_id = 3;   // 0 = 来源标注已被删（★样本与它的标签仍在，训练历史不被改写）
  string binding       = 4;
  google.protobuf.Timestamp t_from = 5;
  google.protobuf.Timestamp t_to   = 6;
  string label         = 7;   // ★入集那一刻的快照
  string created_at    = 8;
}
message ListSamplesReq {
  int64  dataset_id = 1;
  string label      = 2;
  string binding    = 3;
  int32  offset     = 4;
  int32  limit      = 5;
}
message ListSamplesRes { repeated Sample items = 1; int32 total = 2; }
message AddSamplesReq    { int64 dataset_id = 1; repeated int64 annotation_ids = 2; }
message RemoveSamplesReq { int64 dataset_id = 1; repeated int64 sample_ids = 2; }
message CopySamplesReq   { repeated int64 sample_ids = 1; int64 to_dataset = 2; }

// ── 工件 ──
message Artifact {
  int64  id      = 1;
  string domain  = 2;
  // model | baseline | image …★**不是封闭枚举**：新种类随时加，请按字符串透传，别写死分支。
  string kind    = 3;
  string binding = 4;   // 空 = 全域通用（v5 是每传感器一个模型，故常态是具体对象）
  string name    = 5;
  string algo    = 6;
  int64  dataset_id    = 7;
  int32  sample_count  = 8;
  int32  feature_count = 9;
  // ★准确率**可空**：没测过就是没测过。`has_accuracy=false` 时请显示"未测"，**别显示 0**。
  double accuracy      = 10;
  bool   has_accuracy  = 11;
  bool   active        = 12;
  // 下载路径（相对工件根）。**大对象走 HTTP**：`GET /artifacts/<path>`，见 C-8 §3。
  string path    = 13;
  int64  size    = 14;
  string sha256  = 15;
  string meta_json  = 16;
  string created_at = 17;
  // ── 来历（1.5 新增）──────────────────────────────────────────────
  // ★`origin`：`trained`（本系统训练面产出）/ `imported`（外部导入）。**不是封闭枚举**。
  //   `imported` 的工件，请在界面上**如实标注"外部导入、训练数据未经本系统核实"** ——
  //   本系统没有核实外部训练数据的手段，所以**没有"已核实"这个状态**（有了就会有人去点）。
  string origin        = 18;
  // 从哪来。训练产出为"训练任务 N"；外部导入为导入时填的来源（如原文件路径）。
  string source        = 19;
  // 训练数据说明。训练产出由我方自动写（训练集名、样本数、标签分布）；外部导入为导入时填的（可能是"未知"）。
  string training_data = 20;
  // 许可。外部导入必填（不清楚就是"未知"）；训练产出为空。
  string license       = 21;
  // ── 训练数据的来源性质（1.6 新增，贵方 C-36 §4）────────────────────────
  // ★这一格只回答一件事：**这条结论能不能用来说现场设备的话。**
  //   `simulated` / `field` / 空。**不是封闭枚举**，按字符串透传。
  //
  //   ★**只读**（由我方写，不接受调用方设置）：训练产出按**样本入集时的快照取最严**
  //     —— 训练集里混了仿真与现场，这一格记 `simulated`（贵方 C-36 §4.2.2）。
  //     外部导入按导入时声明；没声明就是空。
  //   ★**空 ≠ 现场**：1.6 之前产出的工件读出来都是空，界面按「未声明」显示，
  //     **不许当现场**（贵方 C-36 §4.2.1）。
  //   ★**不是工件的好坏**：`simulated` 不是"差的工件"，跑链路、做回归都该用它
  //     （贵方 C-36 §4.2.3）。
  string data_origin   = 22;
}
message ListArtifactsReq {
  string domain  = 1;
  string kind    = 2;
  string binding = 3;
  bool   binding_set = 4;   // ★true 才按 binding 过滤；否则空串会被当成"全域通用"那一档
  int32  offset  = 5;
  int32  limit   = 6;
}
message ListArtifactsRes { repeated Artifact items = 1; int32 total = 2; }

// ── 训练任务 ──
message TrainJob {
  int64  id         = 1;
  string domain     = 2;
  int64  dataset_id = 3;
  string binding    = 4;
  string algo       = 5;
  // pending | running | ready | failed | canceled。★**终态不可覆盖**：
  //   已失败的任务被改成"就绪"，界面上就再也看不出它失败过。
  string status     = 6;
  string message    = 7;   // ★失败原因在这，不是只打日志
  double progress   = 8;   // 0~1
  int32  sample_count = 9;
  int64  artifact_id  = 10;
  string created_at   = 11;
  string started_at   = 12;
  string finished_at  = 13;
}
message StartTrainingReq {
  string domain     = 1;
  int64  dataset_id = 2;
  // 作用对象。空 = 训一个**全域通用**的模型；给了就是"这台设备专用"（v5 是每传感器一个）。
  string binding    = 3;
  // 想用哪个算法。★**由域解释**，骨架不枚举 —— 域自己在 `capabilities`/文档里说它认哪几个。
  string algo       = 4;
}
message ListTrainJobsReq { string domain = 1; string status = 2; int32 offset = 3; int32 limit = 4; }
message ListTrainJobsRes { repeated TrainJob items = 1; int32 total = 2; }

// ── 片段与报告 ──
message Segment {
  int64  id      = 1;
  string domain  = 2;
  string binding = 3;
  google.protobuf.Timestamp t_from = 4;
  google.protobuf.Timestamp t_to   = 5;
  string name    = 6;
  string source  = 7;
  int32  point_count = 8;
  string note    = 9;
  string created_at = 10;
}
message ListSegmentsReq { string domain = 1; string binding = 2; int32 offset = 3; int32 limit = 4; }
message ListSegmentsRes { repeated Segment items = 1; int32 total = 2; }
message PutSegmentReq {
  string domain  = 1;
  string binding = 2;
  google.protobuf.Timestamp t_from = 3;
  google.protobuf.Timestamp t_to   = 4;
  string name    = 5;
  string source  = 6;
  int32  point_count = 7;
  string note    = 8;
}
message Report {
  int64  id         = 1;
  int64  segment_id = 2;
  string kind       = 3;   // basic | deep
  string path       = 4;   // `GET /reports/<path>`
  int64  size       = 5;
  string created_at = 6;
}
message ListReportsRes { repeated Report items = 1; }

// 对片段再判别一次的结果。**不写回实时库**（回溯判别不该篡改历史）。
message RediagnoseRes {
  bool   ok = 1;
  string message = 2;
  repeated FindingItem findings = 3;
}
message FindingItem {
  string key     = 1;
  string display = 2;
  // 值按类型三选一；**质量非 Ok 时三个都不给**（坏质量下不许有值）。
  oneof value { double num = 3; bool flag = 4; string text = 5; }
  // daq.StatusCode。★`-1001 QualityConfigError` = 台账没填，去补配置；
  //   `-1007` 是采集中断，去查设备 —— **不是一回事**（订正自 AI-12 §2.2，贵方 C-10 §2 逮到）。
  int32  status_code = 6;
  google.protobuf.Timestamp t = 7;
}

// ═══════════ 训练那几口的三条使用说明（1.3）═══════════
//
// 1. **`StartTraining` 只对声明了 `train` 能力位的域成立**，其余当场拒（`ok=false` 带原因）。
//    ⇒ 请**按能力位渲染**：没有 `train` 的域根本不该出现训练入口。
//
// 2. **新训出来的工件不自动启用**。启用是人的决定 —— 自动启用等于"训一次就换一次现场模型"，
//    而训练常常只是拿新标注试试看。界面上给"启用"按钮（`ActivateArtifact`）。
//
// 3. ★**"用了多少条样本"要显示出来**。样本记的是一段时间范围，等到训练时那段可能已经
//    被实时库滚存删掉了；取不到的样本**不进**训练集，但丢了几条、为什么丢，
//    我方写在 `TrainJob.message` 里，也在工件的 `meta_json` 里留一份。
//    「用 200 条训出来的」与「以为用 200 条、实际只用了 3 条」是**两个模型**，
//    而后者在界面上看起来和前者一模一样。
//
// ═══════════ 仍未开的一件 ═══════════
//
// **报告生成** —— v5 的深度报告是 LLM 出的，而"LLM 出网"这条还没定。
// 报告的**存储与下载已就位**（`ListReports` + HTTP `GET /reports/<path>`），
// 缺的只是"谁来生成"。定了加一个 RPC 即可，**加方法不破兼容**。
